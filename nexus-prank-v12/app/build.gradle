plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.siedlar.nexusprank'
    compileSdk 36

    defaultConfig {
        applicationId 'pl.siedlar.nexusprank.v14'
        minSdk 26
        targetSdk 36
        versionCode 14
        versionName '14.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.0'
}
