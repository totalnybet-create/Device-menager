plugins { id 'com.android.application' }
android {
  namespace 'pl.premiumdesign.studio'
  compileSdk 35
  defaultConfig { applicationId 'pl.premiumdesign.studio'; minSdk 29; targetSdk 35; versionCode 1; versionName '1.0.0' }
  buildTypes { debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }; release { minifyEnabled false; shrinkResources false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt') } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
