plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.devicemanager.app'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.devicemanager.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
