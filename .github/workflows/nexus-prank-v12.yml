name: Build Nexus Prank v12

on:
  push:
    branches:
      - nexus-prank-v12
    paths:
      - 'nexus-prank-v12/**'
      - '.github/workflows/nexus-prank-v12.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure Android SDK 35
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: nexus-prank-v12
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare artifact
        run: |
          cp nexus-prank-v12/app/build/outputs/apk/debug/app-debug.apk Nexus-Prank-v12.apk
          sha256sum Nexus-Prank-v12.apk > Nexus-Prank-v12.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Nexus-Prank-v12
          path: |
            Nexus-Prank-v12.apk
            Nexus-Prank-v12.apk.sha256
          if-no-files-found: error
          retention-days: 30
