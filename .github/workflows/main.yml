name: Device Manager CI

on:
  push:
    branches: ["main", "work/**"]
  pull_request:
    branches: ["main", "work/device-manager-full-packet"]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall app.py device_manager tests migrations

      - name: Migration upgrade and rollback
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/migration-test.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke run
        env:
          DEVICE_MANAGER_DB_PATH: ${{ runner.temp }}/smoke.db
        run: python app.py
