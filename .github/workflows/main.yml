name: Device Manager CI

on:
  push:
    branches: ["main", "work/**"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile check
        run: python -m compileall app.py tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke run
        run: python app.py
