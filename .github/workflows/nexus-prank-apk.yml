name: Nexus Prank APK

on:
  push:
    branches:
      - nexus-prank-apk
    paths:
      - 'nexus-prank-android/**'
      - 'nexus-prank-web/**'
      - '.github/workflows/nexus-prank-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build offline Nexus web bundle
        working-directory: nexus-prank-web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Embed web bundle in APK
        run: |
          set -euo pipefail
          rm -rf nexus-prank-android/app/src/main/assets
          mkdir -p nexus-prank-android/app/src/main/assets
          cp -a nexus-prank-web/dist/. nexus-prank-android/app/src/main/assets/
          test -s nexus-prank-android/app/src/main/assets/index.html
          test -n "$(find nexus-prank-android/app/src/main/assets/assets -type f -print -quit)"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: nexus-prank-android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          set -euo pipefail
          APK='nexus-prank-android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$APK" | grep -q 'assets/assets/'
          mkdir -p nexus-prank-dist
          cp "$APK" nexus-prank-dist/Nexus-Prank-v1.1.1.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee nexus-prank-dist/apk-badging.txt
          sha256sum nexus-prank-dist/Nexus-Prank-v1.1.1.apk | tee nexus-prank-dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Prank-APK-v1.1.1
          path: nexus-prank-dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified APK to build branch
        run: |
          set -euo pipefail
          rm -rf dist/nexus-prank
          mkdir -p dist/nexus-prank
          cp nexus-prank-dist/* dist/nexus-prank/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/nexus-prank
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(nexus): publish verified v1.1.1 APK [skip ci]'
          git push origin HEAD:nexus-prank-apk
